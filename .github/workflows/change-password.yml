name: تغيير كلمة المرور
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Set new password
        env:
          CONTENT_KEY: ${{ secrets.CONTENT_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python .github/scripts/set_password.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add key.json
          git commit -m "Change site password" || echo "no change"
          git push
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
