const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(){try{return sessionStorage.getItem('msk')||localStorage.getItem('msk')}catch(e){return null}},
 set(v,rem){try{sessionStorage.setItem('msk',v);if(rem)localStorage.setItem('msk',v)}catch(e){}},
 clear(){try{sessionStorage.removeItem('msk');localStorage.removeItem('msk')}catch(e){}}};
let K=null;
async function keyfile(){if(!K)K=await (await fetch('/key.json',{cache:'no-store'})).json();return K}
async function open_(kek,after){
  const k=await keyfile();
  const w=await crypto.subtle.importKey('raw',kek,'AES-GCM',false,['decrypt']);
  const ck=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(k.iv)},w,u(k.wk));
  const c=await crypto.subtle.importKey('raw',ck,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},c,u(D.ct));
  const html=new TextDecoder().decode(pt);if(after)after();
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r));
  document.open();document.write(html);document.close();}
async function derive(pw){const k=await keyfile();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u(k.salt),iterations:k.it},base,256));}
(async()=>{const s=store.get();if(s){try{await open_(u(s));return}catch(e){store.clear()}}
 const f=document.getElementById('f');f.hidden=false;
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;b.textContent='جارٍ التحقق...';
  try{const raw=await derive(document.getElementById('pw').value);const rem=document.getElementById('rm').checked;
   await open_(raw,()=>store.set(btoa(String.fromCharCode(...raw)),rem));}
  catch(x){document.getElementById('err').textContent='كلمة المرور غير صحيحة';b.disabled=false;b.textContent='دخول'}};})();
